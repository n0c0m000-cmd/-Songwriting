<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌詞リール プロンプトジェネレーター</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap');

:root{
  --bg:#14120F;
  --panel:#1E1B17;
  --text:#F0EAE0;
  --muted:#A69C8E;
  --en:#E4A548;
  --jp:#4F8FA6;
  --border:#35302A;
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Zen Kaku Gothic New', sans-serif;
  margin:0;
  padding:20px;
  line-height:1.6;
}

.wrap{
  max-width:800px;
  margin:0 auto;
  background:var(--panel);
  padding:28px;
  border-radius:6px;
  border:1px solid var(--border);
}

h1{
  font-family:'Shippori Mincho', serif;
  margin:0 0 8px;
  font-size:24px;
}

p.desc{
  color:var(--muted);
  font-size:14px;
  margin-top:0;
}

label{
  display:block;
  margin-top:20px;
  font-size:14px;
  color:var(--en);
  font-weight:bold;
}

textarea{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px;
  font-size:14px;
  border-radius:4px;
  resize:vertical;
}

textarea.exp{ min-height:120px; }
textarea.out{ min-height:220px; margin-top:10px; font-family:monospace; font-size:13px; }

button{
  width:100%;
  margin-top:16px;
  padding:14px;
  background:var(--en);
  color:#14120F;
  border:none;
  border-radius:4px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button:hover{ opacity:0.9; }

button.copy-btn{
  background:var(--jp);
  color:#fff;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="wrap">
  <h1>歌詞リール プロンプト作成</h1>
  <p class="desc">録音メモを入力してボタンを押すと、Claudeに貼り付けるプロンプトが生成されます。</p>

  <label for="expInput">録音メモ（経験談・情景）</label>
  <textarea id="expInput" class="exp" placeholder="例）終電を逃した夜、コンビニの灯りだけが眩しくて、二人で歩道橋の上から街を見てた。"></textarea>

  <button id="genBtn">プロンプトを生成する</button>

  <div id="outputArea" style="display:none; margin-top:24px;">
    <label>生成されたプロンプト（これをコピーしてClaudeに貼り付けます）</label>
    <textarea id="promptOutput" class="out" readonly></textarea>
    <button id="copyBtn" class="copy-btn">プロンプトをコピー</button>
  </div>
</div>

<script>
const expInput = document.getElementById('expInput');
const genBtn = document.getElementById('genBtn');
const outputArea = document.getElementById('outputArea');
const promptOutput = document.getElementById('promptOutput');
const copyBtn = document.getElementById('copyBtn');

genBtn.addEventListener('click', () => {
  const exp = expInput.value.trim();
  if(!exp){
    alert('録音メモを入力してください');
    return;
  }

  const prompt = `あなたはSUNO(AI作曲サービス)向けの歌詞パーツを作る、日英バイリンガルの作詞家です。
以下の実体験・情景をもとに、指定の構成で歌詞を作成してください。

【経験談・情景】
${exp}

【曲の固定構成】
Intro → Verse1(英語) → Chorus(基本フック) → Verse2(日本語) → Chorus(1〜2行だけ変化) → Verse3(日本語) → Chorus(完全反復) → Verse4(英語+日本語、Outro役)

【ルール】
・言葉の重複を避け、具体的な描写（カメラで撮影できるもの）を中心に書く。
・恋愛の定番句（baby, my love, forever 等）や直接的な感情語（寂しい、好き等）は避ける。
・VERSE1（英語6行）：短音節の断片。主語+動詞で完結する文は不可。
・VERSE2（日本語6行）：体言止め中心。感情を説明しない。
・VERSE3（日本語6行）：Verse2から自然につなげる。
・CHORUS（英語4行）：2〜3語の短フレーズ反復。音の気持ちよさを重視。
・Verse4：Outroとして余韻を残し、Verse1に戻ってループできるトーンにする。

SUNOにそのまま貼り付けられる形式（[Intro], [Verse 1], [Chorus] などのタグ付き）で出力してください。`;

  promptOutput.value = prompt;
  outputArea.style.display = 'block';
});

copyBtn.addEventListener('click', () => {
  promptOutput.select();
  navigator.clipboard.writeText(promptOutput.value);
  alert('プロンプトをコピーしました！Claudeのチャットに貼り付けて送信してください。');
});
</script>
</body>
</html>
